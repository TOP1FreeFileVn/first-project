const items=[
 {id:'sword',name:'Kiếm Gỗ',slot:'weapon',kind:'Vũ khí',rarity:'green',grade:'Thường',lv:8,stat:'Công +74',skill:'Chém xoáy',hero:'heroSword'},
 {id:'bow',name:'Cung Săn',slot:'weapon',kind:'Vũ khí',rarity:'blue',grade:'Hiếm',lv:6,stat:'Công +83',skill:'Mưa tên',hero:'heroBow'},
 {id:'staff',name:'Gậy Sao',slot:'weapon',kind:'Vũ khí',rarity:'purple',grade:'Sử thi',lv:5,stat:'Công +111',skill:'Sao băng',hero:'heroStaff'},
 {id:'axe',name:'Rìu Lửa',slot:'weapon',kind:'Vũ khí',rarity:'purple',grade:'Sử thi',lv:7,stat:'Công +141',skill:'Chẻ lửa',hero:'heroAxe'},
 {id:'katana',name:'Katana Nguyệt',slot:'weapon',kind:'Vũ khí',rarity:'orange',grade:'Huyền thoại',lv:4,stat:'Công +156',skill:'Trảm nguyệt',hero:'heroKatana'},

 {id:'boots',name:'Giày Gió',slot:'boots',kind:'Giày',rarity:'blue',grade:'Hiếm',lv:5,stat:'Máu +266 · Công +12'}
];
const bag=[2,4,3,1,5,6,7,0,5,7,1,2,6,0,3,5,1,7,2,6].map((n,i)=>({...items[n],key:'bag-'+i,lv:[5,4,7,6,8,6,5,3,2,4,2,1,3,1,2,3,4,2,5,1][i]}));
const image=(id,cls='',alt='')=>`<img class="${cls}" src="${art[id]}" alt="${alt}" draggable="false">`;
const category={weapon:'slotWeapon',helmet:'slotHelmet',armor:'slotArmor',boots:'slotBoots'};
function gear(item,worn=false,upgrade=false){return `<button type="button" class="eq-gear" data-key="${item.key||item.id}" aria-label="${item.name}, ${item.grade}, Lv.${item.lv}${worn?', đang mặc':''}" style="--rarity:var(--rare-${item.rarity})">${image(item.id,'eq-item')}${image(category[item.slot],'eq-slot')}<span class="eq-lv">Lv.${item.lv}</span>${worn?'<span class="eq-worn">Đang mặc</span>':''}${upgrade?'<span class="eq-arrow" aria-label="Có thể nâng cấp">⬆</span>':''}</button>`}
const nav=()=>`<nav class="eq-native-bottom" aria-label="Bottom bar carton hiện tại của game">${image('gameBottom','','Bottom bar carton gốc, đang chọn Anh hùng')}${['Cửa hàng','Anh hùng','Trận chiến','Lính','Triệu hồi'].map((label,i)=>`<button type="button" class="eq-native-hit" aria-label="${label}" ${i===1?'aria-current="page"':''} data-nav="${label}"></button>`).join('')}</nav>`;
const stats=()=>`<div class="eq-stats">${[['heart','4.86K'],['sword','312'],['armor','128']].map(([id,n])=>`<div class="eq-stat">${image(id)}<span>${n}</span></div>`).join('')}</div>`;
root.querySelectorAll('.eq-stage').forEach((stage,index)=>{
 const design=stage.dataset.design;
 const state={filter:'all',descending:true,selected:null,equipped:{weapon:{...items[0]},helmet:{...items[5]},armor:{...items[6]},boots:{...items[7]}}};
 stage.innerHTML=`<article class="eq-phone" data-design="${design}" aria-label="Demo ${['Tủ đồ carton','Xưởng mèo','Hồ sơ anh hùng'][index]}"><header class="eq-top"><button type="button" class="eq-back" aria-label="Quay lại">${image('back')}</button><h2>Anh hùng</h2><span class="eq-currency">${image('coin')}24.8K</span><span class="eq-currency">${image('gem')}360</span></header><div class="eq-hero"><div class="eq-doll"></div>${stats()}<div class="eq-skill"><span class="eq-skill-label">${image('gear')} <span class="eq-current-skill">Chém xoáy</span></span><span class="eq-small-note">Hợp lính</span><span class="eq-pair">${image('sword')}${image('spear')}</span></div></div><section class="eq-inventory" aria-label="Túi trang bị"><div class="eq-bag-heading"><span>Túi trang bị</span><span class="eq-capacity">20 món</span></div><div class="eq-tools"><button class="eq-filter" type="button" data-filter="all" aria-pressed="true">Tất cả</button><button class="eq-filter" type="button" data-filter="weapon" aria-pressed="false">Vũ khí</button><button class="eq-filter" type="button" data-filter="gear" aria-pressed="false">Phòng thủ</button><button type="button" class="eq-sort">Độ hiếm ↓</button></div><div class="eq-grid"></div></section>${nav()}<div class="eq-overlay" hidden role="dialog" aria-label="Chi tiết trang bị" aria-modal="true"><div class="eq-detail"><div class="eq-detail-header"><span class="eq-detail-title"></span><button type="button" class="eq-close" aria-label="Đóng chi tiết">×</button></div><div class="eq-detail-body"><img class="eq-detail-image" alt=""><div class="eq-detail-copy"></div></div><div class="eq-actions"><button type="button" class="eq-action eq-action-secondary" data-action="upgrade">Nâng cấp</button><button type="button" class="eq-action" data-action="equip">Trang bị</button></div></div></div><div class="eq-toast" hidden role="status" aria-live="polite"></div></article>`;
 stage.querySelector('.eq-top').innerHTML=image('gameHeader','eq-game-header','Thanh tài nguyên hiện tại của game');
 stage.querySelector('.eq-phone').setAttribute('aria-label','Demo trang bị · Bìa giấy');
 const phone=stage.querySelector('.eq-phone'),overlay=phone.querySelector('.eq-overlay'),grid=phone.querySelector('.eq-grid');
 let lastFocus=null,toastTimer;
 const center=()=>`<div class="eq-center"><span class="eq-name">Mèo anh hùng · Lv.12</span>${image(state.equipped.weapon.hero,'eq-cat','Mèo anh hùng đang cầm vũ khí')}<div class="eq-power">${image('power')}<span>2.480</span></div></div>`;
 function renderHero(){const e=state.equipped;phone.querySelector('.eq-doll').innerHTML=design==='dossier'?`${center()}<div class="eq-equipped-cluster">${gear(e.weapon,true,true)}${gear(e.helmet,true,false)}${gear(e.armor,true,true)}${gear(e.boots,true,false)}</div>`:`<div class="eq-side">${gear(e.weapon,true,true)}${gear(e.helmet,true,false)}</div>${center()}<div class="eq-side">${gear(e.armor,true,true)}${gear(e.boots,true,false)}</div>`;phone.querySelector('.eq-current-skill').textContent=e.weapon.skill;}
 function renderBag(){const order={green:0,blue:1,purple:2,orange:3};let shown=bag.filter(it=>state.filter==='all'||(state.filter==='weapon'?it.slot==='weapon':it.slot!=='weapon'));if(!state.descending)shown=[...shown].sort((a,b)=>order[b.rarity]-order[a.rarity]);grid.innerHTML=shown.map(it=>gear(it)).join('');phone.querySelector('.eq-capacity').textContent=shown.length+' món';}
 function toast(msg){const el=phone.querySelector('.eq-toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},1800);}
 function close(){overlay.hidden=true;lastFocus?.focus();}
 function show(item){state.selected=item;lastFocus=document.activeElement;phone.querySelector('.eq-detail-title').textContent=item.name;const img=phone.querySelector('.eq-detail-image');img.src=art[item.id];img.alt=item.name;img.style.setProperty('--detail-rarity',`var(--rare-${item.rarity})`);phone.querySelector('.eq-detail-copy').innerHTML=`<div>${item.grade} · ${item.kind}</div><div>Lv.${item.lv} / 20</div><div class="eq-gain">${item.stat}</div>${item.skill?`<div>${item.skill}</div>`:''}`;const wearing=Object.values(state.equipped).includes(item);phone.querySelector('[data-action="equip"]').textContent=wearing?'Đang mặc':'Trang bị';phone.querySelector('[data-action="upgrade"]').textContent='Nâng cấp · 240';overlay.hidden=false;phone.querySelector('.eq-close').focus();}
 phone.addEventListener('click',ev=>{const card=ev.target.closest('.eq-gear');if(card){const key=card.dataset.key;show(bag.find(it=>it.key===key)||Object.values(state.equipped).find(it=>it.key===key||it.id===key));return}const filter=ev.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;phone.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===filter)));renderBag();return}if(ev.target.closest('.eq-sort')){state.descending=!state.descending;phone.querySelector('.eq-sort').textContent=state.descending?'Độ hiếm ↓':'Độ hiếm ↑';renderBag();return}if(ev.target.closest('.eq-close')||ev.target===overlay){close();return}if(ev.target.closest('[data-action="equip"]')){const it=state.selected;state.equipped[it.slot]=it;renderHero();close();toast('Đã trang bị '+it.name+' · bản thử');return}if(ev.target.closest('[data-action="upgrade"]')){state.selected.lv=Math.min(20,state.selected.lv+1);renderHero();renderBag();show(state.selected);toast('Đã nâng cấp · bản thử');return}if(ev.target.closest('[data-nav]'))toast('Đang xem thử giao diện Anh hùng');if(ev.target.closest('.eq-back'))toast('Bản demo trang bị');});
 overlay.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if(ev.key==='Tab'){const controls=[...overlay.querySelectorAll('button')];const first=controls[0],last=controls.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
 renderHero();renderBag();
 if(globalThis.Tweak){const palette={hero:getComputedStyle(phone).getPropertyValue('--hero').trim(),bag:getComputedStyle(phone).getPropertyValue('--bag').trim()};const tweak=new Tweak({container:phone,onChange:()=>{phone.style.setProperty('--hero',palette.hero);phone.style.setProperty('--bag',palette.bag)}});tweak.addColorPicker(palette,'hero',{label:'Nền anh hùng',reference:'--hero'});tweak.addColorPicker(palette,'bag',{label:'Nền túi đồ',reference:'--bag'});}
});
})();
</script>
