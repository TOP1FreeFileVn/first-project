<!doctype html><html lang="vi"><meta charset="utf-8">
<style>
@font-face{font-family:Game;src:url('../../../../game/ui/fonts/PaytoneOne-Regular.ttf')}
body{margin:0;background:#79583e;color:#fff1d1;font:18px Game}canvas{display:block;margin:auto}
</style>
<canvas id="art" width="900" height="470"></canvas>
<script src="../../../../.claude/skills/canvas-vector-art/scripts/pen.js"></script>
<script src="boots.js"></script>
<script>
const ctx=document.querySelector('canvas').getContext('2d');
const old=new Image();old.src='../../../../game/ui/art/icon_slot_boots.svg';
function fitGlyph(layer,knownBounds=null){
 let l=256,t=256,r=0,b=0;
 if(knownBounds){[l,t,r,b]=knownBounds;}
 else{const data=layer.getContext('2d').getImageData(0,0,256,256).data;
 for(let y=0;y<256;y++)for(let x=0;x<256;x++)if(data[(y*256+x)*4+3]){l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y);}}
 const w=r-l+1,h=b-t+1,k=24/Math.max(w,h);
 ctx.drawImage(layer,l,t,w,h,18-w*k/2,18-h*k/2,w*k,h*k);
}
function badge(x,y,size,color,newArt=true){
 ctx.save();ctx.translate(x,y);ctx.scale(size/36,size/36);
 ctx.fillStyle='#583f21';ctx.beginPath();ctx.roundRect(0,0,36,36,4);ctx.fill();
 ctx.fillStyle='#f9e8bf';ctx.beginPath();ctx.roundRect(2,2,32,32,3);ctx.fill();
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(4,4,28,28,2);ctx.fill();
 const layer=document.createElement('canvas');layer.width=256;layer.height=256;
 const ink=layer.getContext('2d');
 if(newArt){Pen.toCanvas(BootsBadge.icon(256),ink);}
 else{ink.drawImage(old,0,0);ink.globalCompositeOperation='source-in';ink.fillStyle='#fff';ink.fillRect(0,0,256,256);}
 fitGlyph(layer,newArt?null:[21,53,228,202]);
 ctx.restore();
}
Promise.all([old.decode(),document.fonts.load('26px Game')]).then(()=>{
 ctx.fillStyle='#fff1d1';ctx.font='26px Game';ctx.fillText('BIỂU TƯỢNG GIÀY · CỔ THẤP, MŨI TRÒN',28,43);
 ctx.font='20px Game';ctx.fillText('Cũ',208,90);ctx.fillText('Mới',630,90);
 badge(139,110,174,'#347f9d',false);badge(561,110,174,'#347f9d');
 ctx.font='17px Game';ctx.fillText('Kích thước trong game',28,346);
 ['#5b813e','#347f9d','#8659ac','#b56c33'].forEach((c,i)=>badge(315+i*70,324,18,c));
 ctx.fillText('Phóng to để xem dáng',28,410);
 ['#5b813e','#347f9d','#8659ac','#b56c33'].forEach((c,i)=>badge(315+i*70,374,44,c));
});
</script></html>
