<!doctype html>
<html lang="vi"><meta charset="utf-8"><title>Xu vàng tươi</title>
<style>
@font-face{font-family:Game;src:url('../../../../game/ui/fonts/PaytoneOne-Regular.ttf')}
body{margin:0;background:#a6c6bc;color:#583f21;font:16px Game,sans-serif;padding:24px}
h1{font-size:21px;margin:0 0 18px}.row{display:flex;gap:12px}.option{width:210px;text-align:center}.large{width:130px;height:130px;display:block;margin:0 auto 12px}.samples{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:15px}.sample{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px}.pill{margin:12px auto 0;border-radius:7px;width:202px;height:36px;display:flex;align-items:center;justify-content:center;gap:6px;background:#d7e6d7;color:#583f21;font-size:16px}.diamond{width:26px;height:26px;object-fit:contain;margin-left:7px}
</style>
<h1>Xu vàng tươi · dấu gear nhỏ</h1><div class="row">
<section class="option" data-icon="classic"><canvas class="large" width="260" height="260"></canvas><div>Xu vàng sáng</div><div class="pill"><canvas width="56" height="56" style="width:28px;height:28px"></canvas>50.000<img class="diamond" alt="Kim cương bè" src="../diamond-icons/svg/diamond-brilliant-32.svg">30</div><div class="samples"></div></section>
<section class="option" data-icon="tilted"><canvas class="large" width="260" height="260"></canvas><div>Xu nghiêng</div><div class="pill"><canvas width="56" height="56" style="width:28px;height:28px"></canvas>50.000<img class="diamond" alt="Kim cương bè" src="../diamond-icons/svg/diamond-brilliant-32.svg">30</div><div class="samples"></div></section>
<section class="option" data-icon="stack"><canvas class="large" width="260" height="260"></canvas><div>Chồng xu vàng</div><div class="pill"><canvas width="56" height="56" style="width:28px;height:28px"></canvas>50.000<img class="diamond" alt="Kim cương bè" src="../diamond-icons/svg/diamond-brilliant-32.svg">30</div><div class="samples"></div></section>
</div>
<script src="../../../../.claude/skills/canvas-vector-art/scripts/pen.js"></script><script src="icons.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el=>{const pen=new Pen();BrightGoldOptions.draw[el.dataset.icon](pen);for(const size of [24,32]){const wrap=document.createElement('div');wrap.className='sample';wrap.innerHTML=`<canvas width="${size*2}" height="${size*2}" style="width:${size}px;height:${size}px"></canvas><span>${size} px</span>`;el.querySelector('.samples').append(wrap)}el.querySelectorAll('canvas').forEach(c=>{const ctx=c.getContext('2d');ctx.scale(c.width/96,c.height/96);Pen.toCanvas(pen.ops,ctx)})});
</script></html>
