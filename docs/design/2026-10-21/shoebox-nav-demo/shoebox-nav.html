#shoebox-nav-review .shoe-world{width:360px;height:640px;position:absolute;top:0;left:0;transform:scale(var(--shoe-k));transform-origin:top left}
#shoebox-nav-review .shoe-pages{position:absolute;inset:0;overflow:hidden}
#shoebox-nav-review .shoe-pages>img{position:absolute;inset:0;width:360px;height:640px;object-fit:cover;opacity:0;transform:translateX(0);transition:opacity 150ms ease-out,transform 180ms ease-out;pointer-events:none}

#shoebox-nav-review .shoe-mouth{z-index:1;background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+CiAgPHBhdGggZD0iTTI5IDQ5SDcxTDk3IDYxSDNaIiBmaWxsPSIjYjE4YTViIiBzdHJva2U9IiM3MTUwMzIiIHN0cm9rZS13aWR0aD0iMS45IiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+CiAgPHBhdGggZD0iTTMwIDUxSDcwTDkxIDU4SDlaIiBmaWxsPSIjZDBhNDczIi8+CiAgPHBhdGggZD0iTTkgNThIOTFMOTcgNjFIM1oiIGZpbGw9IiM5NzcwNDciLz4KICA8cGF0aCBkPSJNMzIgNTFINjgiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2VkYzk5NyIgc3Ryb2tlLXdpZHRoPSIxLjEiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgo8L3N2Zz4K')}
#shoebox-nav-review .shoe-flaps{position:absolute;left:0;top:0;width:100%;height:99px;overflow:visible;z-index:2}
#shoebox-nav-review .shoe-flaps polygon{fill:#edcc96;stroke:#715032;stroke-width:1.9;stroke-linejoin:round}
#shoebox-nav-review .shoe-flaps line{stroke:#b98c57;stroke-width:1.1;stroke-linecap:round}
#shoebox-nav-review .shoe-item{position:absolute;z-index:5;width:calc(36px + var(--rise)*8px);height:calc(36px + var(--rise)*8px);left:50%;top:calc(59px - var(--rise)*39px);transform:translateX(-50%) scale(var(--pop));transform-origin:50% 80%;display:grid;place-items:center}
#shoebox-nav-review .shoe-item>img{width:100%;height:100%;object-fit:contain;display:block}
#shoebox-nav-review .shoe-alert{position:absolute;right:-4px;top:-3px;width:9px;height:9px;display:grid;place-items:center;background:#e86f61;border:1.2px solid #fff0cc;border-radius:50%;color:#fff7dc;font:400 7px/1 ShoePaytone,sans-serif}
#shoebox-nav-review .shoe-lip{z-index:6;opacity:var(--lid)}
#shoebox-nav-review .shoe-caption{position:absolute;z-index:7;left:0;right:0;top:80px;color:#583f21;text-align:center;font-size:calc(11.5px / var(--shoe-k));font-weight:400;line-height:1.2;white-space:nowrap;opacity:var(--title);transform:translateY(calc(5px - var(--title)*5px));text-shadow:0 1px #f3d6a4}
#shoebox-nav-review .shoe-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(prefers-reduced-motion:reduce){#shoebox-nav-review .shoe-pages>img{transition:none}}
</style>
<script>
(()=>{
  const root=document.getElementById('shoebox-nav-review');
  const phone=root.querySelector('.shoe-phone');
  const buttons=Array.from(root.querySelectorAll('.shoe-tab'));
  const pages=Array.from(root.querySelectorAll('.shoe-pages>img'));
  const status=root.querySelector('.shoe-reader');
  const labels=['Cửa hàng','Anh hùng','Chiến','Lính','Triệu hồi'];
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  const config={duration:300};
  let selected=2, frame=0;
  const clamp=v=>Math.max(0,Math.min(1,v));
  const out=t=>1-Math.pow(1-clamp(t),3);
  const mix=(a,b,t)=>a+(b-a)*t;
  const closed=[[3,61],[50,61],[50,49],[29,49]];
  const opened=[[3,61],[-4,48],[22,36],[29,49]];
  const flapNodes=buttons.map(button=>{
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    svg.setAttribute('aria-hidden','true');
    svg.classList.add('shoe-flaps');
    const parts=[0,1].map(()=>{
      const polygon=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      const crease=document.createElementNS('http://www.w3.org/2000/svg','line');
      svg.append(polygon,crease);return {polygon,crease};
    });
    button.querySelector('.shoe-art').prepend(svg);
    return parts;
  });
  const states=buttons.map((button,index)=>({lid:index===2?1:0,rise:index===2?1:0,width:index===2?1:0,title:index===2?1:0,press:1,pressFrom:1,pressTo:1,pressAt:0,transition:null,pop:1}));
  function paint(index){
    const s=states[index],b=buttons[index];
    b.style.setProperty('--lid',s.lid.toFixed(4));
    b.style.setProperty('--rise',s.rise.toFixed(4));
    b.style.setProperty('--title',s.title.toFixed(4));
    b.style.setProperty('--press',s.press.toFixed(4));
    b.style.setProperty('--push',((1-s.press)/.06*2).toFixed(3)+'px');
    b.style.setProperty('--pop',s.pop.toFixed(4));
    b.style.flexGrow=(1+.32*s.width).toFixed(4);
    const points=closed.map((p,j)=>p.map((v,k)=>mix(v,opened[j][k],clamp(s.lid))));
    flapNodes[index].forEach(({polygon,crease},side)=>{
      const pts=points.map(([x,y])=>[side?100-x:x,y]);
      polygon.setAttribute('points',pts.map(p=>p.map(v=>v.toFixed(3)).join(',')).join(' '));
      const [a,,,d]=pts;
      crease.setAttribute('x1',a[0]);crease.setAttribute('y1',a[1]);
      crease.setAttribute('x2',d[0]);crease.setAttribute('y2',d[1]);
    });
  }
  function tick(now){
    frame=0;let pending=false;
    states.forEach((s,i)=>{
      if(s.transition){
        const a=s.transition, t=(now-a.at)*300/config.duration, to=a.to,from=a.from;
        if(to){
          s.lid=mix(from.lid,1,out(t/155));
          s.rise=mix(from.rise,1,out((t-40)/220));
          s.title=mix(from.title,1,out((t-80)/160));
          s.width=mix(from.width,1,out(t/240));
          s.pop=1+.085*Math.sin(Math.PI*clamp((t-40)/260));
        }else{
          s.rise=mix(from.rise,0,out(t/150));
          s.lid=mix(from.lid,0,out((t-65)/155));
          s.title=mix(from.title,0,out(t/100));
          s.width=mix(from.width,0,out(t/220));
          s.pop=mix(from.pop,1,out(t/150));
        }
        if(t>=300){s.lid=s.rise=s.title=s.width=to;s.pop=1;s.transition=null;}else pending=true;
      }
      if(s.press!==s.pressTo){
        const p=clamp((now-s.pressAt)/(s.pressTo<1?60:100));
        s.press=mix(s.pressFrom,s.pressTo,out(p));
        if(p>=1)s.press=s.pressTo;else pending=true;
      }
      paint(i);
    });
    if(pending)frame=requestAnimationFrame(tick);
  }
  function start(){if(!frame)frame=requestAnimationFrame(tick);}
  function press(index,down){
    const s=states[index];s.pressFrom=s.press;s.pressTo=down?.94:1;s.pressAt=performance.now();
    if(reduce.matches){s.press=s.pressTo;paint(index);}else start();
  }
  function store(){
    if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{concept:'Hộp carton hai cánh',selectedTab:labels[selected]},privateContent:{selected,duration:config.duration}}).catch(()=>{});
  }
  function select(index,animate=true,save=true){
    if(!Number.isInteger(index)||index<0||index>4)return;
    const previous=selected;
    if(previous===index){if(save)store();return;}
    selected=index;const now=performance.now();
    states.forEach((s,i)=>{
      const to=i===index?1:0;
      s.transition=animate&&!reduce.matches?{at:now,to,from:{lid:s.lid,rise:s.rise,width:s.width,title:s.title,pop:s.pop}}:null;
      if(!s.transition){s.lid=s.rise=s.title=s.width=to;s.pop=1;}
      buttons[i].setAttribute('aria-pressed',String(i===index));paint(i);
    });
    const direction=index>previous?1:-1;
    pages.forEach((page,i)=>{
      page.style.transition='none';
      page.style.transform=i===index&&animate&&!reduce.matches?'translateX('+(direction*14)+'px)':'translateX(0)';
      page.classList.toggle('shown',i===previous);
    });
    void pages[index].offsetWidth;
    pages.forEach((page,i)=>{
      page.style.transition='';page.classList.toggle('shown',i===index);
      page.style.transform='translateX(0)';
    });
    status.textContent=labels[index]+' — hộp đang mở';start();if(save)store();
  }
  buttons.forEach((button,i)=>{
    let cancelled=false,held=false;
    button.addEventListener('pointerdown',e=>{if(e.button!==0)return;cancelled=false;held=true;press(i,true);button.setPointerCapture(e.pointerId);});
    button.addEventListener('pointermove',e=>{if(!held)return;const r=button.getBoundingClientRect();const outside=e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;if(outside){cancelled=true;press(i,false);}});
    button.addEventListener('pointerup',e=>{held=false;press(i,false);const r=button.getBoundingClientRect();cancelled=cancelled||e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;});
    button.addEventListener('pointercancel',()=>{held=false;cancelled=true;press(i,false);});
    button.addEventListener('lostpointercapture',()=>{held=false;press(i,false);});
    button.addEventListener('click',()=>{if(cancelled){cancelled=false;return;}select(i);});
    button.addEventListener('keydown',e=>{
      if(e.key===' '||e.key==='Enter')press(i,true);
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=(i+(e.key==='ArrowRight'?1:4))%5;buttons[next].focus();select(next);}
    });
    button.addEventListener('keyup',()=>press(i,false));
    button.addEventListener('blur',()=>press(i,false));
  });
  const resize=()=>phone.style.setProperty('--shoe-k',String(phone.clientWidth/360));
  new ResizeObserver(resize).observe(phone);resize();states.forEach((s,i)=>paint(i));
  function restore(saved){
    const value=saved&&saved.privateContent;
    if(value){if(Number.isFinite(value.duration))config.duration=Math.max(200,Math.min(420,value.duration));select(value.selected,false,false);}
  }
  if(window.openai)restore(window.openai.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail&&event.detail.globals&&event.detail.globals.widgetState));
  if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{store();}});tweak.addSlider(config,'duration',{label:'Nhịp mở và đóng hộp',min:200,max:420,step:10,unit:'ms'});}
})();
</script>
